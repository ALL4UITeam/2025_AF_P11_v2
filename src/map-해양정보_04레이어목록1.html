			<script>
				// map.js가 로드된 후 실행
				initTransparencySliders('.transparency-slider', (slider, value) => {
					const layerId = slider.dataset.layerId;

					// 함수 호출
					console.log(`${layerId} 투명도: ${value.toFixed(1)}%`);
				});
